<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineMatch | Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <i data-lucide="utensils" class="brand-icon" style="color: var(--primary);"></i>
            DineMatch
        </a>
    </nav>

    <div class="container fade-up" style="animation-delay: 0.1s;">
        <div class="empty-state">
            <div class="empty-icon" style="color: var(--primary);">
                <i data-lucide="alert-triangle" style="width:64px; height:64px;"></i>
            </div>
            <h2>Oops! Something went wrong</h2>
            <p class="error-msg">{{ error_message }}</p>
            <a href="/" class="btn btn-primary" style="margin-top:20px;">Return to Home</a>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
